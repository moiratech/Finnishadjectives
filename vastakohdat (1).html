<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Vastakohdat</title>
<style>
  :root{
    --bg:#F3F5F1;
    --ink:#17302A;
    --ink-soft:#4B615B;
    --surface:#FFFFFF;
    --surface-2:#E7EBE4;
    --blue:#3E6E8E;
    --blue-soft:#DCE7ED;
    --red:#C1554B;
    --red-soft:#F3DEDB;
    --green:#5F8767;
    --green-soft:#DDE9DD;
    --line:#C9D2C9;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101B18;
      --ink:#EDF2EE;
      --ink-soft:#9FB2AC;
      --surface:#182620;
      --surface-2:#1F2F28;
      --blue-soft:#22384A;
      --red-soft:#3A2422;
      --green-soft:#213328;
      --line:#2C3D35;
    }
  }
  :root[data-theme="dark"]{
    --bg:#101B18;
    --ink:#EDF2EE;
    --ink-soft:#9FB2AC;
    --surface:#182620;
    --surface-2:#1F2F28;
    --blue-soft:#22384A;
    --red-soft:#3A2422;
    --green-soft:#213328;
    --line:#2C3D35;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:20px 16px 48px;
  }

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
  }
  header.top h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0;
  }
  header.top h1 span{ color:var(--blue); }
  header.top .streak{
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
  }
  header.top .streak b{ color:var(--red); font-size:16px; }

  nav.modes{
    display:flex;
    gap:6px;
    background:var(--surface-2);
    padding:4px;
    border-radius:12px;
    margin-bottom:16px;
  }
  nav.modes button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 6px;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    border-radius:9px;
    cursor:pointer;
  }
  nav.modes button.active{
    background:var(--surface);
    color:var(--ink);
    font-weight:700;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }

  .cats{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:14px;
    scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none;}
  .cats button{
    flex:none;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    padding:7px 13px;
    border-radius:999px;
    font-family:inherit;
    font-size:12.5px;
    font-weight:500;
    white-space:nowrap;
    cursor:pointer;
  }
  .cats button.active{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }

  .panel{ min-height:400px; }

  /* ---- Featured card / seesaw motif used in Quiz & Type ---- */
  .duel-card{
    background:var(--surface);
    border-radius:var(--radius);
    border:1px solid var(--line);
    overflow:hidden;
    margin-bottom:16px;
  }
  .duel-top{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:28px 14px;
  }
  .duel-word{
    font-size:30px;
    font-weight:700;
    letter-spacing:-0.01em;
    text-align:center;
    line-height:1.15;
    word-break:break-word;
  }
  .duel-word.fi{ color:var(--blue); }
  .duel-en{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:6px;
    font-weight:500;
  }
  .duel-mid{
    width:1px;
    align-self:stretch;
    background:var(--line);
    margin:0 6px;
  }
  .duel-prompt{
    text-align:center;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--ink-soft);
    padding:10px 14px;
    background:var(--surface-2);
  }

  /* Quiz options */
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .opt{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 10px;
    font-family:inherit;
    font-size:17px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    min-height:58px;
  }
  .opt:active{ transform:scale(.98); }
  .opt.correct{ background:var(--green-soft); border-color:var(--green); color:var(--green); }
  .opt.wrong{ background:var(--red-soft); border-color:var(--red); color:var(--red); }
  .opt[disabled]{ cursor:default; }

  /* Type mode */
  .type-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .type-row input{
    flex:1;
    font-family:inherit;
    font-size:18px;
    font-weight:600;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    outline:none;
  }
  .type-row input:focus{ border-color:var(--blue); }
  .type-row input.correct{ border-color:var(--green); background:var(--green-soft); }
  .type-row input.wrong{ border-color:var(--red); background:var(--red-soft); }
  .type-row button{
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    padding:0 20px;
    border-radius:12px;
    border:none;
    background:var(--ink);
    color:var(--bg);
    cursor:pointer;
  }
  .type-feedback{
    min-height:20px;
    font-size:13.5px;
    font-weight:500;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .type-feedback.wrong{ color:var(--red); }
  .type-feedback.correct{ color:var(--green); }

  .next-btn{
    display:block;
    width:100%;
    margin-top:12px;
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    padding:14px;
    border-radius:12px;
    border:none;
    background:var(--blue);
    color:#fff;
    cursor:pointer;
  }

  /* Match grid */
  .match-stats{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:10px;
    font-weight:500;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }
  .card{
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:11px;
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px 6px;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    line-height:1.2;
  }
  .card.selected{ border-color:var(--blue); background:var(--blue-soft); }
  .card.matched{ border-color:var(--green); background:var(--green-soft); color:var(--green); opacity:.55; cursor:default; }
  .card.shake{ animation:shake .3s; border-color:var(--red); background:var(--red-soft); }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  .end-state{
    text-align:center;
    padding:40px 10px;
  }
  .end-state .big{ font-size:40px; font-weight:700; margin-bottom:4px; }
  .end-state .sub{ color:var(--ink-soft); font-size:14px; margin-bottom:18px; }

  footer.stats{
    margin-top:26px;
    display:flex;
    gap:10px;
  }
  footer.stats .stat{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    text-align:center;
  }
  footer.stats .stat b{ display:block; font-size:19px; }
  footer.stats .stat span{ font-size:11px; color:var(--ink-soft); font-weight:500; }

  progress.bar{
    -webkit-appearance:none; appearance:none;
    width:100%; height:6px; border-radius:4px; border:none;
    margin-bottom:14px; overflow:hidden;
  }
  progress.bar::-webkit-progress-bar{ background:var(--surface-2); border-radius:4px; }
  progress.bar::-webkit-progress-value{ background:var(--blue); border-radius:4px; }
  progress.bar::-moz-progress-bar{ background:var(--blue); border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Vastak<span>ohdat</span></h1>
    <div class="streak">🔥 <b id="streakVal">0</b></div>
  </header>

  <nav class="modes">
    <button data-mode="match" class="active">Pariuta</button>
    <button data-mode="quiz">Tietovisa</button>
    <button data-mode="type">Kirjoita</button>
  </nav>

  <div class="cats" id="catBar"></div>

  <div class="panel" id="panel"></div>

  <footer class="stats">
    <div class="stat"><b id="statCorrect">0</b><span>OIKEIN</span></div>
    <div class="stat"><b id="statBest">0</b><span>PARAS PUTKI</span></div>
    <div class="stat"><b id="statSeen">0</b><span>SANAA NÄHTY</span></div>
  </footer>
</div>

<script>
/* ---------------- Data ---------------- */
const DATA = [

  {fi1:"iso",en1:"big",fi2:"pieni",en2:"small",cat:"koko"},

  {fi1:"aikuinen",en1:"adult",fi2:"lapsi",en2:"child",cat:"aika"},
  {fi1:"ensimmäinen",en1:"first",fi2:"viimeinen",en2:"last",cat:"aika"},
  {fi1:"talvi",en1:"winter",fi2:"kesä",en2:"summer",cat:"aika"},
  // feelings
  {fi1:"iloinen",en1:"happy",fi2:"surullinen",en2:"sad",cat:"tunteet"},
  {fi1:"onnellinen",en1:"happy / content",fi2:"surullinen",en2:"sad",cat:"tunteet"},
  {fi1:"rauhallinen",en1:"calm",fi2:"vilkas",en2:"lively",cat:"tunteet"},
  {fi1:"rauhallinen",en1:"calm",fi2:"hermostunut",en2:"nervous",cat:"tunteet"},
  {fi1:"optimistinen",en1:"optimistic",fi2:"pessimistinen",en2:"pessimistic",cat:"tunteet"},
  {fi1:"väsynyt",en1:"tired",fi2:"pirteä",en2:"perky",cat:"tunteet"},
  {fi1:"nälkäinen",en1:"hungry",fi2:"kylläinen",en2:"full (fed)",cat:"tunteet"},
  {fi1:"rohkea",en1:"brave",fi2:"arka",en2:"timid / shy",cat:"tunteet"},
  // personality
  {fi1:"kiltti",en1:"kind",fi2:"ilkeä",en2:"mean",cat:"luonne"},
  {fi1:"ystävällinen",en1:"friendly",fi2:"epäystävällinen",en2:"unfriendly",cat:"luonne"},
  {fi1:"kohtelias",en1:"polite",fi2:"epäkohtelias",en2:"impolite",cat:"luonne"},
  {fi1:"ahkera",en1:"hardworking",fi2:"laiska",en2:"lazy",cat:"luonne"},
  {fi1:"itsekäs",en1:"selfish",fi2:"huomaavainen",en2:"considerate",cat:"luonne"},
  {fi1:"puhelias",en1:"talkative",fi2:"hiljainen",en2:"quiet",cat:"luonne"},
  {fi1:"äänekäs",en1:"loud",fi2:"hiljainen",en2:"quiet",cat:"luonne"},
  {fi1:"ankara",en1:"strict",fi2:"lempeä",en2:"gentle",cat:"luonne"},
  {fi1:"fiksu",en1:"smart",fi2:"tyhmä",en2:"stupid",cat:"luonne"},
  {fi1:"hauska",en1:"fun",fi2:"vakava",en2:"serious",cat:"luonne"},
  {fi1:"rehellinen",en1:"honest",fi2:"epärehellinen",en2:"dishonest",cat:"luonne"},
  {fi1:"luotettava",en1:"trustworthy",fi2:"epäluotettava",en2:"untrustworthy",cat:"luonne"},
  {fi1:"huolellinen",en1:"careful",fi2:"huolimaton",en2:"careless",cat:"luonne"},
  {fi1:"tylsä",en1:"boring",fi2:"mielenkiintoinen",en2:"interesting",cat:"luonne"},
  // physical
  {fi1:"pehmeä",en1:"soft",fi2:"kova",en2:"hard",cat:"aisti"},
  {fi1:"terävä",en1:"sharp",fi2:"tylsä",en2:"blunt",cat:"aisti"},
  {fi1:"lämmin",en1:"warm",fi2:"kylmä",en2:"cold",cat:"aisti"},
  {fi1:"lämmin",en1:"warm",fi2:"viileä",en2:"cool",cat:"aisti"},
  {fi1:"kuuma",en1:"hot",fi2:"kylmä",en2:"cold",cat:"aisti"},
  {fi1:"makea",en1:"sweet",fi2:"hapan",en2:"sour",cat:"aisti"},
  {fi1:"valoisa",en1:"light (bright)",fi2:"pimeä",en2:"dark",cat:"aisti"},
  {fi1:"tumma",en1:"dark",fi2:"vaalea",en2:"pale",cat:"aisti"},
  {fi1:"musta",en1:"black",fi2:"valkoinen",en2:"white",cat:"aisti"},
  {fi1:"värikäs",en1:"colorful",fi2:"väritön",en2:"colorless",cat:"aisti"},
  {fi1:"ehjä",en1:"intact",fi2:"rikki",en2:"broken",cat:"aisti"},
  {fi1:"sula",en1:"melted",fi2:"jäinen",en2:"icy",cat:"aisti"},
  {fi1:"puhdas",en1:"clean",fi2:"likainen",en2:"dirty",cat:"aisti"},
  {fi1:"siisti",en1:"tidy",fi2:"sotkuinen",en2:"messy",cat:"aisti"},
  // value / quality
  {fi1:"hyvä",en1:"good",fi2:"huono",en2:"bad",cat:"arvo"},
  {fi1:"kaunis",en1:"beautiful",fi2:"ruma",en2:"ugly",cat:"arvo"},
  {fi1:"kallis",en1:"expensive",fi2:"halpa",en2:"cheap",cat:"arvo"},
  {fi1:"arvokas",en1:"valuable",fi2:"arvoton",en2:"worthless",cat:"arvo"},
  {fi1:"rikas",en1:"rich",fi2:"köyhä",en2:"poor",cat:"arvo"},
  {fi1:"ilmainen",en1:"free",fi2:"maksullinen",en2:"paid",cat:"arvo"},
  {fi1:"turha",en1:"useless",fi2:"tarpeellinen",en2:"necessary",cat:"arvo"},
  {fi1:"helppo",en1:"easy",fi2:"vaikea",en2:"difficult",cat:"arvo"},
  {fi1:"nopea",en1:"fast",fi2:"hidas",en2:"slow",cat:"arvo"},
  {fi1:"vahva",en1:"strong",fi2:"heikko",en2:"weak",cat:"arvo"},
  {fi1:"vakava",en1:"serious (illness)",fi2:"lievä",en2:"mild",cat:"arvo"},
  {fi1:"terve",en1:"healthy",fi2:"sairas",en2:"sick",cat:"arvo"},
  {fi1:"oikea",en1:"right",fi2:"väärä",en2:"wrong",cat:"arvo"},
  {fi1:"elävä",en1:"alive",fi2:"kuollut",en2:"dead",cat:"arvo"},
  // position / verbs / adverbs
  {fi1:"oikein",en1:"correctly",fi2:"väärin",en2:"wrongly",cat:"sijainti"},
  {fi1:"auki",en1:"open",fi2:"kiinni",en2:"closed",cat:"sijainti"},
  {fi1:"sisällä",en1:"inside",fi2:"ulkona",en2:"outside",cat:"sijainti"},
  {fi1:"lähellä",en1:"near",fi2:"kaukana",en2:"far",cat:"sijainti"},
  {fi1:"edessä",en1:"in front",fi2:"takana",en2:"behind",cat:"sijainti"},
  {fi1:"päällä",en1:"on top",fi2:"alla",en2:"under",cat:"sijainti"},
  {fi1:"ylös",en1:"up",fi2:"alas",en2:"down",cat:"sijainti"},
  {fi1:"yksin",en1:"alone",fi2:"yhdessä",en2:"together",cat:"sijainti"},
  {fi1:"työntää",en1:"push",fi2:"vetää",en2:"pull",cat:"sijainti"},
  {fi1:"istua",en1:"sit",fi2:"seisoa",en2:"stand",cat:"sijainti"},
  {fi1:"valvoa",en1:"be awake",fi2:"nukkua",en2:"sleep",cat:"sijainti"},
];

const CAT_LABELS = {
  kaikki:"Kaikki", koko:"Koko", aika:"Ikä & aika", tunteet:"Tunteet",
  luonne:"Luonne", aisti:"Aistit", arvo:"Arvo", sijainti:"Sijainti"
};

/* ---------------- State / storage ---------------- */
const LS_KEY = "vastakohdat_progress_v1";
function loadProgress(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { correct:0, seen:0, bestStreak:0, streak:0, weak:{} };
}
function saveProgress(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(progress)); }catch(e){}
}
let progress = loadProgress();
let activeCat = "kaikki";
let activeMode = "match";

function pool(){
  return activeCat === "kaikki" ? DATA : DATA.filter(d => d.cat === activeCat);
}

function normalize(s){
  return s.trim().toLowerCase().replace(/\s+/g," ");
}

function bump(isCorrect, key){
  progress.seen++;
  if(isCorrect){
    progress.correct++;
    progress.streak++;
    if(progress.streak > progress.bestStreak) progress.bestStreak = progress.streak;
    if(key) delete progress.weak[key];
  } else {
    progress.streak = 0;
    if(key) progress.weak[key] = (progress.weak[key]||0) + 1;
  }
  saveProgress();
  renderStats();
}

function renderStats(){
  document.getElementById("streakVal").textContent = progress.streak;
  document.getElementById("statCorrect").textContent = progress.correct;
  document.getElementById("statBest").textContent = progress.bestStreak;
  document.getElementById("statSeen").textContent = progress.seen;
}

/* ---------------- Category bar ---------------- */
const catBar = document.getElementById("catBar");
Object.keys(CAT_LABELS).forEach(c => {
  const b = document.createElement("button");
  b.textContent = CAT_LABELS[c];
  b.dataset.cat = c;
  if(c === activeCat) b.classList.add("active");
  b.onclick = () => {
    activeCat = c;
    [...catBar.children].forEach(x => x.classList.toggle("active", x.dataset.cat === c));
    render();
  };
  catBar.appendChild(b);
});

/* ---------------- Mode nav ---------------- */
document.querySelectorAll("nav.modes button").forEach(btn => {
  btn.onclick = () => {
    activeMode = btn.dataset.mode;
    document.querySelectorAll("nav.modes button").forEach(b => b.classList.toggle("active", b === btn));
    render();
  };
});

const panel = document.getElementById("panel");

function render(){
  panel.innerHTML = "";
  if(activeMode === "match") renderMatch();
  else if(activeMode === "quiz") renderQuiz();
  else renderType();
}

/* ================= MATCH MODE ================= */
function renderMatch(){
  const p = pool();
  const setSize = Math.min(6, p.length);
  const chosen = shuffle([...p]).slice(0, setSize);

  let cards = [];
  chosen.forEach((pair, i) => {
    cards.push({ id:i, text:pair.fi1, pairId:i, side:"a" });
    cards.push({ id:i+1000, text:pair.fi2, pairId:i, side:"b" });
  });
  cards = shuffle(cards);

  let selected = null;
  let matchedCount = 0;
  let attempts = 0;

  const statsEl = document.createElement("div");
  statsEl.className = "match-stats";
  statsEl.innerHTML = `<span>Etsi pari: sana ↔ vastakohta</span><span id="mAttempts">Yrityksiä: 0</span>`;
  panel.appendChild(statsEl);

  const grid = document.createElement("div");
  grid.className = "grid";
  panel.appendChild(grid);

  cards.forEach(c => {
    const el = document.createElement("div");
    el.className = "card";
    el.textContent = c.text;
    el.dataset.pairId = c.pairId;
    el.dataset.cid = c.id;
    el.onclick = () => {
      if(el.classList.contains("matched") || el.classList.contains("selected")) return;
      if(!selected){
        selected = el;
        el.classList.add("selected");
        return;
      }
      attempts++;
      document.getElementById("mAttempts").textContent = "Yrityksiä: " + attempts;
      if(selected.dataset.pairId === el.dataset.pairId && selected.dataset.cid !== el.dataset.cid){
        selected.classList.remove("selected");
        selected.classList.add("matched");
        el.classList.add("matched");
        matchedCount++;
        bump(true, "match-"+c.pairId);
        selected = null;
        if(matchedCount === chosen.length){
          setTimeout(() => showMatchEnd(attempts, chosen.length), 300);
        }
      } else {
        el.classList.add("shake");
        selected.classList.add("shake");
        bump(false, "match-"+c.pairId);
        const prevSel = selected;
        setTimeout(() => {
          el.classList.remove("shake","selected");
          prevSel.classList.remove("shake","selected");
        }, 350);
        selected = null;
      }
    };
    grid.appendChild(el);
  });
}

function showMatchEnd(attempts, total){
  panel.innerHTML = "";
  const acc = Math.round((total / attempts) * 100);
  const el = document.createElement("div");
  el.className = "end-state";
  el.innerHTML = `
    <div class="big">✓</div>
    <div class="sub">${total} paria, ${attempts} yritystä · ${acc}% tarkkuus</div>
    <button class="next-btn" id="againBtn">Uusi kierros</button>
  `;
  panel.appendChild(el);
  document.getElementById("againBtn").onclick = renderMatch;
}

/* ================= QUIZ MODE ================= */
function renderQuiz(){
  const p = pool();
  if(p.length < 4){
    panel.innerHTML = `<div class="end-state"><div class="sub">Valitse laajempi kategoria (tarvitaan vähintään 4 sanaparia).</div></div>`;
    return;
  }
  const item = weightedPick(p, "quiz");
  const showSecond = Math.random() < 0.5;
  const promptWord = showSecond ? item.fi2 : item.fi1;
  const promptEn = showSecond ? item.en2 : item.en1;
  const correctAnswer = showSecond ? item.fi1 : item.fi2;

  let distractors = shuffle(p.filter(d => d !== item)).slice(0, 3).map(d => Math.random()<0.5 ? d.fi1 : d.fi2);
  distractors = distractors.filter(d => d !== correctAnswer);
  while(distractors.length < 3){
    const cand = p[Math.floor(Math.random()*p.length)];
    const w = Math.random()<0.5 ? cand.fi1 : cand.fi2;
    if(w !== correctAnswer && !distractors.includes(w)) distractors.push(w);
  }
  const choices = shuffle([correctAnswer, ...distractors]);

  const card = document.createElement("div");
  card.className = "duel-card";
  card.innerHTML = `
    <div class="duel-top">
      <div>
        <div class="duel-word fi">${promptWord}</div>
        <div class="duel-en">${promptEn}</div>
      </div>
      <div class="duel-mid"></div>
      <div>
        <div class="duel-word" style="color:var(--red)">?</div>
        <div class="duel-en">vastakohta</div>
      </div>
    </div>
    <div class="duel-prompt">MIKÄ ON VASTAKOHTA?</div>
  `;
  panel.appendChild(card);

  const opts = document.createElement("div");
  opts.className = "options";
  panel.appendChild(opts);

  let answered = false;
  choices.forEach(choice => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = choice;
    b.onclick = () => {
      if(answered) return;
      answered = true;
      const isCorrect = choice === correctAnswer;
      b.classList.add(isCorrect ? "correct" : "wrong");
      if(!isCorrect){
        [...opts.children].forEach(o => { if(o.textContent === correctAnswer) o.classList.add("correct"); });
      }
      [...opts.children].forEach(o => o.disabled = true);
      bump(isCorrect, "quiz-"+item.fi1+item.fi2);
      const next = document.createElement("button");
      next.className = "next-btn";
      next.textContent = "Seuraava";
      next.onclick = renderQuiz;
      panel.appendChild(next);
    };
    opts.appendChild(b);
  });
}

/* ================= TYPE MODE ================= */
function renderType(){
  const p = pool();
  if(p.length < 1){
    panel.innerHTML = `<div class="end-state"><div class="sub">Valitse kategoria.</div></div>`;
    return;
  }
  const item = weightedPick(p, "type");
  const showSecond = Math.random() < 0.5;
  const promptWord = showSecond ? item.fi2 : item.fi1;
  const promptEn = showSecond ? item.en2 : item.en1;
  const correctAnswer = showSecond ? item.fi1 : item.fi2;
  const correctEn = showSecond ? item.en1 : item.en2;

  const card = document.createElement("div");
  card.className = "duel-card";
  card.innerHTML = `
    <div class="duel-top">
      <div style="grid-column:1/-1">
        <div class="duel-word fi">${promptWord}</div>
        <div class="duel-en">${promptEn}</div>
      </div>
    </div>
    <div class="duel-prompt">KIRJOITA VASTAKOHTA</div>
  `;
  panel.appendChild(card);

  const feedback = document.createElement("div");
  feedback.className = "type-feedback";
  panel.appendChild(feedback);

  const row = document.createElement("div");
  row.className = "type-row";
  row.innerHTML = `<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="vastaus...">
                    <button id="checkBtn">Tarkista</button>`;
  panel.appendChild(row);

  const input = row.querySelector("input");
  const checkBtn = row.querySelector("#checkBtn");
  let answered = false;

  function check(){
    if(answered || !input.value.trim()) return;
    answered = true;
    const isCorrect = normalize(input.value) === normalize(correctAnswer);
    input.classList.add(isCorrect ? "correct" : "wrong");
    input.disabled = true;
    checkBtn.disabled = true;
    feedback.textContent = isCorrect
      ? "Oikein! " + correctEn
      : "Oikea vastaus: " + correctAnswer + " (" + correctEn + ")";
    feedback.className = "type-feedback " + (isCorrect ? "correct" : "wrong");
    bump(isCorrect, "type-"+item.fi1+item.fi2);
    const next = document.createElement("button");
    next.className = "next-btn";
    next.textContent = "Seuraava";
    next.onclick = renderType;
    panel.appendChild(next);
  }
  checkBtn.onclick = check;
  input.onkeydown = e => { if(e.key === "Enter") check(); };
  setTimeout(() => input.focus(), 50);
}

/* ---------------- helpers ---------------- */
function shuffleOnce(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
// Fisher-Yates is already a uniform-random shuffle after a single pass —
// running it more times adds no additional randomness mathematically.
// This wrapper runs it 7 passes anyway, as an explicit guarantee with zero real cost.
function shuffle(arr, passes = 7){
  let a = arr;
  for(let i = 0; i < passes; i++) a = shuffleOnce(a);
  return a;
}
function weightedPick(list, modePrefix){
  // words previously answered wrong show up ~3x more often
  const weighted = [];
  list.forEach(item => {
    const key = modePrefix + "-" + item.fi1 + item.fi2;
    const w = 1 + Math.min(3, (progress.weak[key]||0)) * 2;
    for(let i=0;i<w;i++) weighted.push(item);
  });
  return weighted[Math.floor(Math.random()*weighted.length)];
}

render();
